name: PR Hygiene - Jira Ticket in Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-jira-ticket:
    uses: aerospike/shared-workflows/.github/workflows/reusable_pr-hygiene.yml@82b197fa01cafc1b1d5a82a77ad039e6e8e44545 # v4.0.0
    with:
      pr_title: ${{ github.event.pull_request.title }}
