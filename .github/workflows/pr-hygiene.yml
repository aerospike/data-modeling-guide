name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # The job id is the required status check "validate-jira-ticket / hygiene-check"
  # in the protect_main ruleset. Renaming it blocks every pull request until the
  # ruleset is updated to match.
  validate-jira-ticket:
    uses: aerospike/shared-workflows/.github/workflows/reusable_pr-hygiene.yml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      pr_title: ${{ github.event.pull_request.title }}
      # Outside contributors cannot see or open Aerospike JIRA tickets.
      types-requiring-jira: ""
